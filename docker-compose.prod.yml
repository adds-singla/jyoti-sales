# Production docker-compose with HTTPS via Nginx + Let's Encrypt Certbot
# Usage:
#   1. Copy .env.example → .env and fill all values
#   2. Set DOMAIN=yourdomain.com in .env
#   3. First time only — get SSL certificate:
#        docker compose -f docker-compose.prod.yml run --rm certbot certonly \
#          --webroot --webroot-path=/var/www/certbot \
#          -d yourdomain.com -d www.yourdomain.com \
#          --email your@email.com --agree-tos --no-eff-email
#   4. docker compose -f docker-compose.prod.yml up -d
#   5. Certificates auto-renew (certbot service handles it)

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jyoti-sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jyoti_sales}
      POSTGRES_USER: ${DB_USER:-jyoti}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - jyoti_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jyoti} -d ${DB_NAME:-jyoti_sales}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./jyoti-sales-backend
    container_name: jyoti-sales-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jyoti_sales}
      DB_USER: ${DB_USER:-jyoti}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-razorpay}
      BIZ_NAME: ${BIZ_NAME}
      BIZ_ADDRESS: ${BIZ_ADDRESS}
      BIZ_PHONE: ${BIZ_PHONE}
      BIZ_EMAIL: ${BIZ_EMAIL}
      BIZ_GSTIN: ${BIZ_GSTIN}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: https://${DOMAIN}
    # Backend NOT exposed directly — all traffic goes through nginx reverse proxy
    expose:
      - "8080"

  frontend:
    build:
      context: ./jyoti-sales-frontend
      args:
        VITE_API_BASE_URL: https://${DOMAIN}/api
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: jyoti-sales-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  # Nginx — reverse proxy, SSL termination, gzip, security headers
  nginx:
    image: nginx:1.27-alpine
    container_name: jyoti-sales-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro

  # Certbot — auto-renews Let's Encrypt certificates every 12h
  certbot:
    image: certbot/certbot:latest
    container_name: jyoti-sales-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

volumes:
  jyoti_pg_data:
