version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jyoti-sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jyoti_sales}
      POSTGRES_USER: ${DB_USER:-jyoti}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jyoti_pass}
    ports:
      - "5432:5432"
    volumes:
      - jyoti_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jyoti} -d ${DB_NAME:-jyoti_sales}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./jyoti-sales-backend
    container_name: jyoti-sales-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jyoti_sales}
      DB_USER: ${DB_USER:-jyoti}
      DB_PASSWORD: ${DB_PASSWORD:-jyoti_pass}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-min-32-chars-long-please}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-dummy}
      BIZ_NAME: ${BIZ_NAME:-Jyoti Sales}
      BIZ_ADDRESS: ${BIZ_ADDRESS:-[[Full shop address, PIN]]}
      BIZ_PHONE: ${BIZ_PHONE:-[[10-digit number]]}
      BIZ_EMAIL: ${BIZ_EMAIL:-[[email]]}
      BIZ_GSTIN: ${BIZ_GSTIN:-[[GSTIN]]}
      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Email
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # App
      FRONTEND_URL: ${FRONTEND_URL:-https://jyotisales.in}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./jyoti-sales-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    container_name: jyoti-sales-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  jyoti_pg_data:
